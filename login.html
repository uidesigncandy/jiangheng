<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 - 江恒广告</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #000 url('assets/image%204.png') center / cover no-repeat;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      pointer-events: none;
    }
    .container {
      position: relative;
      background: rgba(255, 255, 255, 0.97);
      border-radius: 24px;
      padding: 48px 64px 56px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35),
                  0 0 0 1px rgba(255, 255, 255, 0.08) inset;
      backdrop-filter: blur(12px);
    }
    .brand-logo {
      display: block;
      width: 44px;
      height: auto;
      margin: 0 auto 20px;
    }
    h1 {
      font-size: 1.6rem;
      margin: 0 0 8px;
      color: #1e293b;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #64748b;
      margin: 0 0 32px;
      font-weight: 400;
    }
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
    }
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      font-size: 1rem;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #fff;
      color: #1e293b;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }
    .form-group input::placeholder {
      color: #9ca3af;
    }
    .error-msg {
      font-size: 0.85rem;
      color: #dc2626;
      margin-top: 8px;
      min-height: 20px;
    }
    .btn {
      width: 100%;
      padding: 16px 24px;
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      margin-top: 8px;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.45);
    }
    .btn:active {
      transform: translateY(0);
    }
    .hint {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 20px;
      line-height: 1.5;
    }
    @media (max-width: 768px) {
      .container {
        padding: 36px 28px 44px;
        border-radius: 20px;
      }
      h1 {
        font-size: 1.4rem;
      }
      .form-group input {
        padding: 12px 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="assets/logo.png" alt="江恒广告" class="brand-logo" />
    <h1>江恒广告</h1>
    <p class="subtitle">请登录后使用</p>
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">邮箱</label>
        <input type="email" id="email" name="email" placeholder="请输入邮箱" autocomplete="email" required />
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password" required />
      </div>
      <p class="error-msg" id="errorMsg" role="alert"></p>
      <button type="submit" class="btn" id="submitBtn">登 录</button>
    </form>
    <p class="hint">需在 Supabase 控制台创建用户（Authentication → Users）</p>
  </div>

  <script type="module">
    import { getSession, signIn } from './js/auth.js';

    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');

    const session = await getSession();
    if (session) {
      window.location.replace('index.html');
      throw new Error('redirect');
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      errorMsg.textContent = '';
      const email = (emailInput.value || '').trim();
      const password = passwordInput.value || '';

      if (!email) {
        errorMsg.textContent = '请输入邮箱';
        emailInput.focus();
        return;
      }
      if (!password) {
        errorMsg.textContent = '请输入密码';
        passwordInput.focus();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = '登录中…';
      try {
        await signIn(email, password);
        window.location.replace('index.html');
      } catch (err) {
        var msg = err && err.message;
        if (msg && msg.includes('Invalid login credentials')) {
          msg = '邮箱或密码错误，请重试';
        } else if (msg && msg.includes('Email not confirmed')) {
          msg = '请先在邮箱中确认账号';
        } else if (!msg) {
          msg = '登录失败，请检查网络或稍后重试';
        }
        errorMsg.textContent = msg;
        passwordInput.select();
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '登 录';
      }
    });
  </script>
</body>
</html>
